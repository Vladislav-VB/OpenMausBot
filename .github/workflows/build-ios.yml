name: Build iOS App

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Выбираем актуальный Xcode 16
      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate

      - name: Build App (Release)
        working-directory: ios
        run: |
          xcodebuild \
            -project OpenMausCompanion.xcodeproj \
            -scheme OpenMausCompanion \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r ios/DerivedData/Build/Products/Release-iphoneos/OpenMausCompanion.app Payload/
          zip -qr OpenMausCompanion.ipa Payload
          echo "IPA packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMausCompanion-ipa
          path: OpenMausCompanion.ipa
          retention-days: 14