name: Build iOS App

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # ===== ПАТЧ 1: Определение team prefix из provisioning profile =====
      - name: Patch OpenMausSharedConfiguration.swift
        run: |
          cat > ios/AppShared/OpenMausSharedConfiguration.swift << 'SWIFT'
          import Foundation
          import Security

          enum OpenMausSharedConfiguration {
              static let appGroupIdentifier = "group.com.openmausbot.shared"
              static let legacyAppBundleIdentifier = "com.openmausbot.app"
              static let keychainAccessGroupInfoKey = "OpenMausKeychainAccessGroup"

              static var sharedDefaults: UserDefaults? {
                  UserDefaults(suiteName: appGroupIdentifier)
              }

              static var keychainAccessGroup: String? {
                  // 1) Normal signed build — Info.plist has the expanded value
                  if let value = Bundle.main.object(
                      forInfoDictionaryKey: keychainAccessGroupInfoKey
                  ) as? String {
                      let t = value.trimmingCharacters(in: .whitespacesAndNewlines)
                      if !t.isEmpty, !t.contains("$("), t != appGroupIdentifier {
                          return t
                      }
                  }
                  // 2) Sideloaded — read team ID from provisioning profile
                  if let prefix = _teamPrefix {
                      return "\(prefix)\(appGroupIdentifier)"
                  }
                  // 3) Nothing worked — caller will use default group
                  return nil
              }

              static var legacyAppKeychainAccessGroup: String? {
                  guard let shared = keychainAccessGroup,
                        shared.hasSuffix(appGroupIdentifier) else { return nil }
                  let prefix = shared.dropLast(appGroupIdentifier.count)
                  return "\(prefix)\(legacyAppBundleIdentifier)"
              }

              // MARK: - Team prefix discovery

              private static let _teamPrefix: String? = {
                  // Method 1: embedded.mobileprovision (Sideloadly always embeds this)
                  if let p = _prefixFromProfile() { return p }
                  // Method 2: keychain probe
                  if let p = _prefixFromKeychain() { return p }
                  return nil
              }()

              private static func _prefixFromProfile() -> String? {
                  guard let url = Bundle.main.url(forResource: "embedded", withExtension: "mobileprovision"),
                        let data = try? Data(contentsOf: url),
                        let raw = String(data: data, encoding: .ascii),
                        let s = raw.range(of: "<?xml"),
                        let e = raw.range(of: "</plist>") else { return nil }
                  let xml = String(raw[s.lowerBound...e.upperBound])
                  guard let xd = xml.data(using: .utf8),
                        let pl = try? PropertyListSerialization.propertyList(from: xd, format: nil) as? [String: Any],
                        let ids = pl["TeamIdentifier"] as? [String],
                        let team = ids.first, !team.isEmpty else { return nil }
                  return "\(team)."
              }

              private static func _prefixFromKeychain() -> String? {
                  let svc = "com.openmausbot._pfx"
                  let acct = "_p"
                  let base: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: svc,
                      kSecAttrAccount as String: acct,
                  ]
                  SecItemDelete(base as CFDictionary)
                  var add = base
                  add[kSecValueData as String] = Data("x".utf8)
                  _ = SecItemAdd(add as CFDictionary, nil)
                  defer { SecItemDelete(base as CFDictionary) }
                  var fetch = base
                  fetch[kSecReturnAttributes as String] = true
                  fetch[kSecMatchLimit as String] = kSecMatchLimitOne
                  var ref: CFTypeRef?
                  guard SecItemCopyMatching(fetch as CFDictionary, &ref) == errSecSuccess,
                        let a = ref as? [String: Any],
                        let g = a[kSecAttrAccessGroup as String] as? String,
                        let bid = Bundle.main.bundleIdentifier,
                        g.hasSuffix(bid) else { return nil }
                  return String(g.dropLast(bid.count))
              }
          }
          SWIFT

      # ===== ПАТЧ 2: Если shared group недоступен — используем default (а не крашим) =====
      - name: Patch OpenMausSharedKeychain.swift
        run: |
          cat > ios/AppShared/OpenMausSharedKeychain.swift << 'SWIFT'
          import Foundation
          import Security

          enum OpenMausSharedKeychain {
              private static let service = "com.openmausbot.companion.token"

              static func save(_ token: String, for connectionID: String) throws {
                  let group = OpenMausSharedConfiguration.keychainAccessGroup
                  try save(Data(token.utf8), for: connectionID, accessGroup: group)
              }

              static func token(for connectionID: String) throws -> String? {
                  let group = OpenMausSharedConfiguration.keychainAccessGroup
                  return try readToken(for: connectionID, accessGroup: group)
              }

              @discardableResult
              static func remove(_ connectionID: String) -> Bool {
                  let group = OpenMausSharedConfiguration.keychainAccessGroup
                  return remove(connectionID, accessGroup: group)
              }

              static func tokenMigratingLegacyItem(for connectionID: String) throws -> String? {
                  if let shared = try token(for: connectionID) { return shared }
                  let legacyGroup = OpenMausSharedConfiguration.legacyAppKeychainAccessGroup
                  guard let legacy = try readToken(for: connectionID, accessGroup: legacyGroup) else {
                      return nil
                  }
                  try save(legacy, for: connectionID)
                  _ = remove(connectionID, accessGroup: legacyGroup)
                  return legacy
              }

              @discardableResult
              static func removeIncludingLegacyItem(_ connectionID: String) -> Bool {
                  let sharedRemoved = remove(connectionID)
                  guard let legacyGroup = OpenMausSharedConfiguration.legacyAppKeychainAccessGroup else {
                      return sharedRemoved
                  }
                  let legacyRemoved = remove(connectionID, accessGroup: legacyGroup)
                  return sharedRemoved || legacyRemoved
              }

              private static func identity(
                  for connectionID: String,
                  accessGroup: String?
              ) -> [String: Any] {
                  var q: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: service,
                      kSecAttrAccount as String: connectionID,
                  ]
                  if let accessGroup {
                      q[kSecAttrAccessGroup as String] = accessGroup
                  }
                  return q
              }

              private static func save(
                  _ data: Data,
                  for connectionID: String,
                  accessGroup: String?
              ) throws {
                  let itemID = identity(for: connectionID, accessGroup: accessGroup)
                  var query = itemID
                  query[kSecValueData as String] = data
                  query[kSecAttrAccessible as String] = kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly
                  var status = SecItemAdd(query as CFDictionary, nil)
                  if status == errSecDuplicateItem {
                      status = SecItemUpdate(
                          itemID as CFDictionary,
                          [
                              kSecValueData as String: data,
                              kSecAttrAccessible as String: kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly,
                          ] as CFDictionary
                      )
                      if status == errSecItemNotFound {
                          status = SecItemAdd(query as CFDictionary, nil)
                      }
                  }
                  guard status == errSecSuccess else {
                      throw OpenMausSharedKeychainError.security(status)
                  }
              }

              private static func readToken(
                  for connectionID: String,
                  accessGroup: String?
              ) throws -> String? {
                  var query = identity(for: connectionID, accessGroup: accessGroup)
                  query[kSecReturnData as String] = true
                  query[kSecMatchLimit as String] = kSecMatchLimitOne
                  var item: CFTypeRef?
                  let status = SecItemCopyMatching(query as CFDictionary, &item)
                  if status == errSecItemNotFound { return nil }
                  guard status == errSecSuccess else {
                      throw OpenMausSharedKeychainError.security(status)
                  }
                  guard let data = item as? Data,
                        let token = String(data: data, encoding: .utf8) else {
                      throw OpenMausSharedKeychainError.security(errSecDecode)
                  }
                  return token
              }

              private static func remove(
                  _ connectionID: String,
                  accessGroup: String?
              ) -> Bool {
                  let status = SecItemDelete(
                      identity(for: connectionID, accessGroup: accessGroup) as CFDictionary
                  )
                  return status == errSecSuccess || status == errSecItemNotFound
              }
          }

          enum OpenMausSharedKeychainError: LocalizedError {
              case configurationMissing
              case security(OSStatus)

              var errorDescription: String? {
                  switch self {
                  case .configurationMissing:
                      return "Couldn't access the pairing securely: the shared keychain is not configured."
                  case let .security(status):
                      let detail = SecCopyErrorMessageString(status, nil) as String? ?? "status \(status)"
                      return "Couldn't access the pairing securely: \(detail)"
                  }
                  
              }

              var isLocked: Bool {
                  if case let .security(status) = self {
                      return status == errSecInteractionNotAllowed
                  }
                  return false
              }
          }
          SWIFT

      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate

      - name: Build App (Release)
        working-directory: ios
        run: |
          xcodebuild \
            -project OpenMausCompanion.xcodeproj \
            -scheme OpenMausCompanion \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Ad-hoc sign with entitlements
        working-directory: ios/DerivedData/Build/Products/Release-iphoneos
        run: |
          APP="OpenMausCompanion.app"

          cat > /tmp/app.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>TEAM.com.openmausbot.app</string>
            <key>com.apple.security.application-groups</key>
            <array><string>group.com.openmausbot.shared</string></array>
            <key>keychain-access-groups</key>
            <array>
              <string>TEAM.com.openmausbot.app</string>
              <string>TEAM.group.com.openmausbot.shared</string>
            </array>
            <key>get-task-allow</key><true/>
          </dict>
          </plist>
          EOF

          cat > /tmp/share.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>TEAM.com.openmausbot.app.share</string>
            <key>com.apple.security.application-groups</key>
            <array><string>group.com.openmausbot.shared</string></array>
            <key>keychain-access-groups</key>
            <array><string>TEAM.group.com.openmausbot.shared</string></array>
            <key>get-task-allow</key><true/>
          </dict>
          </plist>
          EOF

          cat > /tmp/widgets.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>TEAM.com.openmausbot.app.widgets</string>
            <key>get-task-allow</key><true/>
          </dict>
          </plist>
          EOF

          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" \( -name '*.framework' -o -name '*.dylib' \) \
              -exec codesign --force --sign - {} \;
          fi
          codesign --force --sign - --entitlements /tmp/widgets.entitlements \
            "$APP/PlugIns/OpenMausCompanionWidgets.appex"
          codesign --force --sign - --entitlements /tmp/share.entitlements \
            "$APP/PlugIns/OpenMausShareExtension.appex"
          codesign --force --sign - --entitlements /tmp/app.entitlements \
            "$APP"
          echo "✅ Signed"

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r ios/DerivedData/Build/Products/Release-iphoneos/OpenMausCompanion.app Payload/
          zip -qr OpenMausCompanion.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMausCompanion-ipa
          path: OpenMausCompanion.ipa
          retention-days: 14